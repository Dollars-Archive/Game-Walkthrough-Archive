name: Update walkthrough archive
on:
  push:
    branches: [main]
    paths: [guides.yml, guides/**, scripts/**, tests/**, requirements.txt, docs/index.html, docs/archive.js, .github/workflows/update-guides.yml]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: walkthrough-archive
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.cjs
      - run: python scripts/build_guides.py
      - name: Publish walkthrough downloads and collect counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/guide_downloads.py
      - name: Commit catalogue and published documents
        shell: bash
        run: |
          git add docs README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: 공략집 목록 자동 갱신'
            git push origin HEAD:main
          fi
      - name: Build Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds --jq '.status'
