<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="비너스 앤 브레이브스 스토리 플로우·합류·퇴단·중요 이벤트·보스 체크 가이드">
<title>비너스 앤 브레이브스 · 100년의 여정 플로우 가이드</title>
<style>
:root{
  --bg:#e9e1d3;--paper:#fffaf0;--paper2:#f3eadb;--ink:#282119;--muted:#756a5c;
  --line:#d8c9b6;--gold:#9f7224;--gold2:#d0a148;--brown:#5b3a26;--red:#9b3b36;
  --green:#39775a;--blue:#3d6c87;--purple:#6f5687;--shadow:0 10px 30px rgba(59,41,24,.10);
  --head:rgba(233,225,211,.94);--radius:17px;
}
[data-theme="dark"]{
  --bg:#171411;--paper:#211c18;--paper2:#2c241d;--ink:#f2e8d8;--muted:#beaf9b;
  --line:#493b30;--gold:#e1b45f;--gold2:#f2c875;--brown:#d8aa78;--red:#ee8178;
  --green:#78c49c;--blue:#7fbad9;--purple:#b79ad0;--shadow:0 12px 32px rgba(0,0,0,.3);
  --head:rgba(23,20,17,.94);
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:
  radial-gradient(circle at 82% -8%,color-mix(in srgb,var(--gold2) 18%,transparent),transparent 34%),
  linear-gradient(180deg,color-mix(in srgb,var(--bg) 94%,#fff),var(--bg));
  font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.62}
button,input{font:inherit;color:inherit}button{cursor:pointer}.wrap{width:min(1220px,calc(100% - 28px));margin:auto}
header{padding:46px 0 28px;border-bottom:1px solid var(--line);
background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 10%,var(--bg)),var(--bg) 55%)}
.hero{display:grid;grid-template-columns:1fr 315px;gap:28px;align-items:end}
.eyebrow{font-size:.76rem;font-weight:950;letter-spacing:.15em;color:var(--gold);text-transform:uppercase}
h1{font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(2rem,5vw,3.45rem);line-height:1.08;margin:9px 0 10px;letter-spacing:-.04em}
.subtitle{margin:0;color:var(--muted);max-width:720px}
.progress{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.progress-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.progress strong{font-size:1.7rem;color:var(--gold)}
.progress span{font-size:.8rem;color:var(--muted)}.track{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:.2s}
.toolbar{position:sticky;top:0;z-index:30;background:var(--head);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.toolbar-inner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;overflow-x:auto}
.tabs,.tools{display:flex;align-items:center;gap:6px;white-space:nowrap}.tabs{padding:4px;border-radius:12px;background:var(--paper2);border:1px solid var(--line)}
.tabs button,.icon-btn{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:850}
.tabs button.active{background:var(--paper);color:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.icon-btn{background:var(--paper);border:1px solid var(--line)}.danger{color:var(--red)}
main{padding:22px 0 70px}.notice{background:color-mix(in srgb,var(--gold2) 8%,var(--paper));border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));
border-radius:14px;padding:14px 16px;color:var(--muted);font-size:.88rem}.notice strong{color:var(--ink)}
.view-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:26px 0 13px}
.view-head h2{font-family:Georgia,"Noto Serif KR",serif;margin:0;font-size:1.55rem}.view-head p{margin:3px 0 0;color:var(--muted);font-size:.86rem}
.search{width:min(340px,100%);background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none}
.filterbar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}.filterbar button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 10px;font-size:.76rem;font-weight:800}
.filterbar button.active{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--paper))}
.chapter-list{display:grid;gap:12px}.chapter{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.chapter summary{list-style:none;display:grid;grid-template-columns:86px 1fr auto;gap:15px;align-items:center;padding:17px 18px;cursor:pointer}
.chapter summary::-webkit-details-marker{display:none}.chapter-no{text-align:center;color:var(--gold);font-weight:950}.chapter-no small{display:block;color:var(--muted);font-size:.67rem}
.chapter-title strong{display:block;font-size:1.05rem}.chapter-title span{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.chapter-badges{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}.chapter-body{border-top:1px solid var(--line);padding:17px 18px}
.chapter-summary{background:var(--paper2);padding:13px 14px;border-radius:12px;margin-bottom:15px;font-size:.9rem}
.flow{position:relative;margin-left:7px;padding-left:24px}.flow:before{content:"";position:absolute;left:5px;top:4px;bottom:6px;width:2px;background:var(--line)}
.event{position:relative;display:grid;grid-template-columns:22px 1fr;gap:9px;padding:8px 0}.event:before{content:"";position:absolute;left:-23px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:3px solid var(--gold)}
.event input{width:17px;height:17px;margin-top:4px;accent-color:var(--gold)}.event.done .event-content{opacity:.56}.event.done .event-title{text-decoration:line-through}
.event-title{font-weight:900}.event-text{color:var(--muted);font-size:.84rem;margin-top:2px}
.badge{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--paper2);border-radius:99px;padding:2px 8px;font-size:.67rem;font-weight:900;color:var(--muted);vertical-align:middle}
.badge.join{color:var(--green)}.badge.leave,.badge.leaveopt{color:var(--red)}.badge.death{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.badge.boss{color:var(--purple)}.badge.key{color:var(--gold)}.badge.temp{color:var(--blue)}.badge.critical{color:var(--red);background:color-mix(in srgb,var(--red) 7%,var(--paper))}
.badge.optional{color:var(--green)}.badge.story{color:var(--muted)}.event-title .badge{margin-right:6px}
.boss-mini{margin-top:15px;border-top:1px dashed var(--line);padding-top:12px}.boss-mini h4{margin:0 0 7px;color:var(--gold);font-size:.85rem}.boss-mini-grid{display:flex;gap:6px;flex-wrap:wrap}
.boss-chip{font-size:.76rem;background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:6px 8px}.boss-chip b{color:var(--purple)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}
.card h3{margin:0 0 8px;font-size:1rem}.card p{margin:0;color:var(--muted);font-size:.84rem}.card .meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.table-wrap{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:760px}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--paper2);color:var(--gold);font-weight:950}tr:last-child td{border-bottom:0}
.status-death{color:var(--red);font-weight:900}.status-leave{color:var(--red);font-weight:850}.status-join{color:var(--green);font-weight:850}
.system-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.system-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}
.system-card h3{margin:0 0 6px;color:var(--gold);font-size:.96rem}.system-card p{margin:0;color:var(--muted);font-size:.86rem}
.source{margin-top:24px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:17px;color:var(--muted);font-size:.78rem}
.source b{color:var(--ink)}.empty{padding:38px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:var(--paper)}

.guide-list{display:grid;gap:10px}
.guide-section{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.guide-section summary{list-style:none;cursor:pointer;padding:15px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:950}
.guide-section summary::-webkit-details-marker{display:none}
.guide-section summary small{color:var(--muted);font-size:.7rem;font-weight:800}
.guide-body{border-top:1px solid var(--line);padding:15px 17px}
.guide-lead{margin:0 0 10px;background:var(--paper2);padding:11px 12px;border-radius:10px;font-size:.86rem}
.guide-body ul{margin:0;padding-left:1.2rem}.guide-body li{margin:5px 0;color:var(--muted);font-size:.84rem}
.section-title{font-family:Georgia,"Noto Serif KR",serif;margin:27px 0 10px;font-size:1.22rem}
.compact-table table{min-width:680px}
.item-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:15px}
.item-rule{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.item-rule b{display:block;color:var(--gold);margin-bottom:4px}.item-rule span{font-size:.8rem;color:var(--muted)}
.warning-box{background:color-mix(in srgb,var(--red) 7%,var(--paper));border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));border-radius:14px;padding:14px;margin:14px 0}
.warning-box strong{color:var(--red)}
.item-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.item-controls .search{margin:0;flex:1;min-width:220px}
.item-select{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--ink)}
.item-count{font-size:.76rem;color:var(--muted);font-weight:800}
.mini-note{color:var(--muted);font-size:.76rem;margin:7px 0 0}


.item-kpis{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:0 0 14px}
.item-kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}
.item-kpi strong{display:block;color:var(--gold);font-size:1.35rem;line-height:1.1}
.item-kpi span{display:block;color:var(--muted);font-size:.73rem;margin-top:5px}
.item-filter-grid{display:grid;grid-template-columns:minmax(220px,1.5fr) repeat(4,minmax(125px,.7fr));gap:8px;align-items:center;margin-bottom:10px}
.item-filter-grid .search{width:100%;margin:0}
.translation-tag{display:inline-flex;border-radius:999px;padding:2px 7px;font-size:.66rem;font-weight:900;border:1px solid var(--line);white-space:nowrap}
.translation-tag.keep{color:var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--paper))}
.translation-tag.new{color:var(--green);background:color-mix(in srgb,var(--green) 7%,var(--paper))}
.major-tag{display:inline-flex;border-radius:999px;padding:2px 7px;font-size:.66rem;font-weight:900;border:1px solid var(--line);white-space:nowrap}
.major-tag.rare{color:var(--purple);background:color-mix(in srgb,var(--purple) 8%,var(--paper))}
.major-tag.special{color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--paper))}
.jp-name{color:var(--muted);font-size:.76rem}
.effect-cell{font-weight:800}
.item-table table{min-width:1050px}
@media(max-width:900px){html:not([data-layout="desktop"]) .item-kpis{grid-template-columns:minmax(0,1fr)}html:not([data-layout="desktop"]) .item-filter-grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){html:not([data-layout="desktop"]) .item-kpis{grid-template-columns:minmax(0,1fr)}html:not([data-layout="desktop"]) .item-filter-grid{grid-template-columns:1fr}html:not([data-layout="desktop"]) .item-table table{min-width:980px}}

@media(max-width:900px){html:not([data-layout="desktop"]) .hero{grid-template-columns:1fr}html:not([data-layout="desktop"]) .progress{max-width:420px}html:not([data-layout="desktop"]) .grid{grid-template-columns:repeat(2,minmax(0,1fr))}html:not([data-layout="desktop"]) .chapter summary{grid-template-columns:72px 1fr}html:not([data-layout="desktop"]) .chapter-badges{grid-column:2;justify-content:flex-start}}
@media(max-width:640px){html:not([data-layout="desktop"]) .item-top{grid-template-columns:1fr}html:not([data-layout="desktop"]) .wrap{width:calc(100% - 18px)}html:not([data-layout="desktop"]) header{padding-top:29px}html:not([data-layout="desktop"]) .tabs button,html:not([data-layout="desktop"]) .icon-btn{font-size:.77rem;padding:7px 9px}html:not([data-layout="desktop"]) .view-head{display:block}html:not([data-layout="desktop"]) .search{margin-top:10px}html:not([data-layout="desktop"]) .grid,html:not([data-layout="desktop"]) .system-grid{grid-template-columns:1fr}html:not([data-layout="desktop"]) .chapter summary{grid-template-columns:58px 1fr;padding:14px 11px;gap:8px}html:not([data-layout="desktop"]) .chapter-body{padding:14px 12px}html:not([data-layout="desktop"]) .flow{padding-left:20px}html:not([data-layout="desktop"]) .event:before{left:-19px}}
@media print{.toolbar,.search,.filterbar,.icon-btn,.notice{display:none!important}body{background:#fff;color:#111}.wrap{width:100%}.chapter,.card,.table-wrap,.system-card{box-shadow:none;break-inside:avoid}details>.chapter-body{display:block}.chapter{margin-bottom:8px}}

.toolbar-inner,.tabs,.tools{flex-wrap:wrap;white-space:normal}.toolbar-inner{overflow-x:visible}.chapter-title,.chapter-badges{min-width:0}
html[data-layout="desktop"] body{min-width:1000px}
html[data-layout="mobile"] .wrap{width:min(640px,calc(100% - 18px))}
html[data-layout="mobile"] .hero{grid-template-columns:1fr}
html[data-layout="mobile"] .progress{max-width:420px}
html[data-layout="mobile"] .grid,html[data-layout="mobile"] .system-grid,html[data-layout="mobile"] .item-top,html[data-layout="mobile"] .item-filter-grid{grid-template-columns:minmax(0,1fr)}
html[data-layout="mobile"] .chapter summary{grid-template-columns:58px minmax(0,1fr);padding:14px 11px;gap:8px}
html[data-layout="mobile"] .chapter-badges{grid-column:2;justify-content:flex-start}
html[data-layout="mobile"] .chapter-body{padding:14px 12px}
html[data-layout="mobile"] .view-head{display:block}
html[data-layout="mobile"] .search{margin-top:10px}
html[data-layout="mobile"] .flow{padding-left:20px}
html[data-layout="mobile"] .event:before{left:-19px}
html[data-layout="mobile"] .item-table table{min-width:980px}
</style>
</head>
<body>
<header>
<div class="wrap hero">
  <div>
    <div class="eyebrow">VENUS & BRAVES · 100 YEARS STORY TRACKER</div>
    <h1>비너스 앤 브레이브스<br>100년의 여정 플로우 가이드</h1>
    <p class="subtitle">대사는 빼고, 플레이 중 필요한 사건 · 합류 · 퇴단 · 희생 · 재앙 · 보스만 시간순으로 정리한 실전용 체크리스트</p>
  </div>
  <div class="progress" aria-live="polite">
    <div class="progress-row"><strong id="pct">0%</strong><span id="count">0 / 0 체크</span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
</div>
</header>
<nav class="toolbar">
<div class="wrap toolbar-inner">
  <div class="tabs">
    <button data-view="flow" class="active">스토리 플로우</button>
    <button data-view="roster">인물 출입</button>
    <button data-view="bosses">보스·재앙</button>
    <button data-view="secrets">숨은 이벤트</button>
    <button data-view="system">시스템 설명</button>
    <button data-view="items">아이템</button>
  </div>
  <div class="tools">
    <div class="tabs" role="group" aria-label="화면 구성"><button data-layout-mode="auto">자동</button><button data-layout-mode="desktop">PC</button><button data-layout-mode="mobile">모바일</button></div><button class="icon-btn" id="themeBtn">☾ 어둡게</button>
    <button class="icon-btn danger" id="resetBtn">체크 초기화</button>
  </div>
</div>
</nav>
<main class="wrap">
  <div id="content"></div>

<script>

DATA.systemSections = [{"title": "게임의 기본 흐름", "page": "PDF p.5", "lead": "기본 루프는 ‘거점 → 원정 → 편성 → 전투 → 귀환’이다. 스토리 이벤트와 세대교체는 이 흐름 사이에서 발생한다.", "bullets": ["거점: 동료 상태 확인, 모집, 저장, 원정 준비.", "원정: 필드맵을 이동하며 마물 퇴치와 소문·이벤트 해결.", "편성: 최대 7명을 전열·중열·후열에 배치.", "전투: 로테이션 배틀로 열을 순환시키며 싸운다.", "귀환: 여신의 평가, 입단 희망자, 인간관계 이벤트 등이 발생."]}, {"title": "거점 · 기록실 · 묘지", "page": "PDF p.6~9", "lead": "진행에 따라 거점에서 할 수 있는 일이 늘어난다. 여신의 처소, 집무실, 기록실, 묘지, 용사들의 술집이 핵심이다.", "bullets": ["여신의 처소: 원정 출발, 다음 예언 확인, 저장, 옵션.", "집무실: 편성과 동료 상태·인간관계 확인.", "묘지: 기사단의 전사자와 특별히 활약한 동료의 묘비·정보 확인.", "기록실: 전적, 연보, 예측 안전치·평균연령·강함 추이, 단원 기록, 각종 베스트 기록을 확인."]}, {"title": "용사들의 술집 · 신규모집 · 동료 교체", "page": "PDF p.9", "lead": "기사단 세대교체의 핵심 메뉴. 시간과 정원 제한을 반드시 같이 계산해야 한다.", "bullets": ["신규모집 1회에 자동으로 120일이 흐르고 입단 희망자 3명이 나타난다.", "기사단 동료는 최대 14명. 정원이 꽉 찼다면 기존 동료를 퇴단시켜야 한다.", "입단 희망자가 남아 있는 상태에서 다시 신규모집을 하면 기존 후보는 다시 나타나지 않는다.", "한 번 퇴단시킨 동료는 다시 받을 수 없다.", "퇴단자가 아이템을 장비 중이라면 전승·기사단 반환·폐기 중 하나를 선택한다."]}, {"title": "소문 · 의뢰 · 달인의 가르침", "page": "PDF p.10~11", "lead": "소문은 단순한 사이드 콘텐츠가 아니라 아이템, 인재, 던전, 이동수단을 여는 주요 시스템이다.", "bullets": ["소문·의뢰·정보는 동시에 최대 5개까지 보유할 수 있다.", "오래 방치하면 이벤트가 사라질 수 있으므로 기한을 지도에서 확인한다.", "소문 종류: 아이템, 세계의 달인, 인재, 던전, 회복의 샘, 요정의 길, 마차.", "달인의 가르침은 레벨업·나이 성장과 별개로 특정 능력치를 올린다. 원래 없는 능력은 새로 만들 수 없다."]}, {"title": "원정 · 세계지도 · 이동수단", "page": "PDF p.8, 12~13", "lead": "원정에서는 마물의 마을 파괴 기한과 예측 안전치를 보고 이동 순서를 정하는 것이 중요하다.", "bullets": ["세계지도에서 마물·마을·이벤트·소문 아이콘을 확인할 수 있다.", "마물 정보에서 ‘마을 파괴까지 남은 기간’을 확인해 급한 곳부터 처리한다.", "색적 모드의 점멸이 빠른 마물일수록 파괴 기한이 임박했다.", "이동은 도보가 기본이며 진행 후 배·마차·요정의 길을 사용할 수 있다.", "필드 이동 중에는 시간이 흐르며 지형에 따라 이동 속도가 달라진다."]}, {"title": "축복의 날 · 성장기 · 자녀 세대", "page": "PDF p.13", "lead": "매년 1월 1일은 기사단 전체가 한 살을 먹는 ‘축복의 날’. 이 작품의 100년 세대교체를 만드는 핵심 규칙이다.", "bullets": ["새해에 예측 안전치가 마이너스라면 게임 오버.", "성장기: 15세부터 피크기까지, 능력치가 크게 상승.", "전성기: 피크기부터 쇠퇴 연령까지, 능력치가 계속 상승.", "쇠퇴기: 쇠퇴 연령 이후, 능력치가 크게 하락.", "부부가 낳은 아이는 15세가 되면 입단 희망자로 나타날 수 있고, 한 번 거부하면 다시 나타나지 않는다.", "아이가 8세가 되면 교육 방침을 정해 HP·공격력·민첩성·보조·간접공격·회복력 중 한 방향을 성장시킬 수 있다."]}, {"title": "인간관계 · 친구 · 결혼", "page": "PDF p.7, 24", "lead": "전투 배치와 보조 관계가 반복되면 동료 사이의 인간관계가 깊어진다.", "bullets": ["동성끼리 관계가 깊어지면 친구가 되고 소환정령을 사용할 수 있다.", "이성끼리 관계가 깊어지면 결혼 이벤트가 발생할 수 있다.", "결혼 후 전성기 동안 자녀를 낳을 수 있고, 자녀 세대가 이후 기사단에 들어온다.", "귀환 후 상담 이벤트의 선택에 따라 인간관계가 바뀌기도 한다."]}, {"title": "편성 · 전열/중열/후열", "page": "PDF p.14~15", "lead": "전투 참가자는 최대 7명이며 각 열에는 최대 4명까지 배치할 수 있다. 로테이션으로 세 열이 순환한다.", "bullets": ["전열 = 공격열: 직접 공격 담당.", "중열 = 보조열: 앞 동료의 공격·방어 보조. 아처·발키리 등은 간접공격도 가능.", "후열 = 회복열: 회복 능력이 있는 동료가 회복.", "중열·후열 앞에 전열이 비면 적에게 받는 대미지가 커질 수 있으므로 빈 줄 관리가 중요.", "총 공격력·총 방어력·총 회복력은 편성 화면에서 확인 가능."]}, {"title": "속성 · 피로도 · 파라미터", "page": "PDF p.16~17", "lead": "전투력은 단순 공격력만이 아니라 속성 상성, 피로도, 보조 능력까지 함께 봐야 한다.", "bullets": ["속성 상성: 바람→땅→물→불→바람. 무속성은 상성 영향을 받지 않는다.", "한 번의 원정에서 최대 HP를 넘는 누적 피해를 받으면 부조 상태가 되어 HP를 제외한 능력치가 하락한다.", "호조 상태에서는 HP를 제외한 능력치가 상승한다.", "주요 파라미터: HP, 공격력, 민첩성, 공격보조, 방어보조, 간접공격, 회복력, 강함."]}, {"title": "소환정령", "page": "PDF p.18", "lead": "친구 관계인 두 사람이 모두 전투에 참가하면 한 번의 원정 중 한 번 소환할 수 있다.", "bullets": ["로테이션 페이스에서 □ 버튼으로 소환을 예약한다.", "친구 관계인 두 사람이 모두 출전 중이어야 한다.", "도적단전·온라인 배틀에서는 소환 공격력이 1/7로 감소한다."]}, {"title": "적 정보 · 공격 패턴 · 사고", "page": "PDF p.18~20", "lead": "적 정보 화면은 공략의 핵심. HP만 보지 말고 초회 공격력·초회 방어력·회복력·특수공격·사고까지 확인한다.", "bullets": ["공격 패턴은 7개 순서가 반복되므로 특수공격 타이밍을 미리 계산할 수 있다.", "초회 공격력과 초회 방어력은 로테이션 후 첫 번째 턴에만 계산된다.", "회복력은 로테이션 직후 적이 회복하는 수치.", "사고(思考)는 ‘HP 낮은 자’, ‘전사’, ‘여성’, ‘열 회복자’ 등 특정 아군을 노리는 AI 패턴이다.", "상세 화면에서 발생일, 퇴치 기한, 발생 장소, 1년분 예측 안전치 감소치를 확인할 수 있다."]}, {"title": "로테이션 배틀", "page": "PDF p.20~23", "lead": "전투는 공격 페이스 → 로테이션 페이스 → 회복 페이스가 반복되고, 소환 시 소환 페이스가 추가된다.", "bullets": ["공격 페이스: 전열이 공격하며 민첩성 순으로 행동.", "로테이션 페이스: 약 3초 동안 로테이션(○), 머물기(×), 소환(□), 퇴각(△)을 결정.", "회복 페이스: 후열의 회복자와 회복력을 가진 적이 회복.", "퇴각은 매 턴 한 열씩 뒤로 빠져 전원이 전장을 벗어나면 성공. 도망칠 수 없는 적도 있다.", "간접공격은 중열에서 가능하지만 바로 앞 칸에 동료가 있으면 공격하지 못한다.", "열회복자는 자기 자신을 회복하지 못하므로 같은 열에 열회복자 둘을 두는 것도 한 방법.", "회복량이 최대 HP의 두 배를 넘으면 크리티컬 차지가 발생해 일시적으로 공격력이 두 배가 된다.", "레벨은 마지막 일격을 넣은 동료만 오르며 최대 5 const TYPE=DATA.typeLabels;
const savedLayout=localStorage.getItem('vb_flow_layout');
const state={
  layout:['auto','desktop','mobile'].includes(savedLayout)?savedLayout:'auto',
  view:localStorage.getItem('vb_flow_view')||'flow',
  theme:localStorage.getItem('vb_flow_theme')||'light',
  filter:localStorage.getItem('vb_flow_filter')||'all',
  checks:JSON.parse(localStorage.getItem('vb_flow_checks')||'{}')
};
document.documentElement.dataset.layout=state.layout;
document.documentElement.dataset.theme=state.theme==='dark'?'dark':'';
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const badge=t=>`<span class="badge ${TYPE[t]?.[1]||'story'}">${TYPE[t]?.[0]||t}</span>`;
function eventId(ch,i){return ch.id+'-'+i}
function eventHtml(ch,e,i){
 const id=eventId(ch,i), done=!!state.checks[id];
 return `<label class="event ${done?'done':''}" data-type="${e[0]}">
   <input type="checkbox" data-check="${id}" ${done?'checked':''}>
   <div class="event-content"><div class="event-title">${badge(e[0])}${esc(e[1])}</div><div class="event-text">${esc(e[2])}</div></div>
 </label>`;
}
function chapterHtml(ch){
 const types=[...new Set(ch.events.map(e=>e[0]))];
 const search=(ch.no+' '+ch.title+' '+ch.subtitle+' '+ch.summary+' '+ch.events.flat().join(' ')+' '+ch.bosses.flat().join(' ')).toLowerCase();
 return `<details class="chapter" data-search="${esc(search)}" data-types="${types.join(' ')}">
 <summary>
   <div class="chapter-no">${ch.no}<small>PDF p.${ch.pages}</small></div>
   <div class="chapter-title"><strong>${esc(ch.title)}</strong><span>${esc(ch.subtitle)}</span></div>
   <div class="chapter-badges">${types.filter(t=>['join','leave','leaveopt','death','boss','critical'].includes(t)).slice(0,4).map(badge).join('')}</div>
 </summary>
 <div class="chapter-body">
   <div class="chapter-summary">${esc(ch.summary)}</div>
   <div class="flow">${ch.events.map((e,i)=>eventHtml(ch,e,i)).join('')}</div>
   <div class="boss-mini"><h4>이 구간 주요 전투</h4><div class="boss-mini-grid">${ch.bosses.map(b=>`<span class="boss-chip"><b>${esc(b[0])}</b> · ${esc(b[1])}</span>`).join('')}</div></div>
 </div></details>`;
}
function sourceBox(){return ``}
function renderFlow(){
 return `<div class="view-head"><div><h2>스토리 플로우</h2><p>프롤로그부터 13장까지. 카드를 펼쳐 사건 순서대로 체크하세요.</p></div><input id="search" class="search" type="search" placeholder="장·인물·보스·이벤트 검색"></div>
 <div class="filterbar" id="filters">
 ${[['all','전체'],['join','합류'],['leave','퇴단·이탈'],['death','사망'],['boss','보스'],['critical','필수 기한']].map(f=>`<button data-filter="${f[0]}" class="${state.filter===f[0]?'active':''}">${f[1]}</button>`).join('')}
 </div>
 <div class="chapter-list" id="chapterList">${DATA.chapters.map(chapterHtml).join('')}</div>${sourceBox()}`;
}
function statusClass(s){return s.includes('사망')?'status-death':(s.includes('퇴단')||s.includes('이탈'))?'status-leave':s.includes('합류')?'status-join':''}
function renderRoster(){
 return `<div class="view-head"><div><h2>주요 인물 합류·퇴단 흐름</h2><p>스토리에서 의미가 큰 인물만 추렸습니다. 랜덤 입단 후보 전체 목록이 아닙니다.</p></div><input id="search" class="search" type="search" placeholder="인물·상태 검색"></div>
 <div class="table-wrap"><table><thead><tr><th>인물</th><th>등장/합류</th><th>변화 시점</th><th>상태</th><th>핵심</th></tr></thead><tbody id="rosterRows">
 ${DATA.roster.map(r=>`<tr data-search="${esc(r.join(' ').toLowerCase())}"><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="${statusClass(r[3])}">${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join('')}
 </tbody></table></div>${sourceBox()}`;
}
function renderBosses(){
 return `<div class="view-head"><div><h2>보스·재앙 빠른표</h2><p>일반 잡몹보다 스토리상 의미가 있거나 공략 포인트가 뚜렷한 전투 위주입니다.</p></div><input id="search" class="search" type="search" placeholder="보스·장 검색"></div>
 <div class="table-wrap"><table><thead><tr><th>구간</th><th>장</th><th>보스/전투</th><th>요점</th></tr></thead><tbody id="bossRows">
 ${DATA.bosses.map(r=>`<tr data-search="${esc(r.join(' ').toLowerCase())}"><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td><b>${esc(r[2])}</b></td><td>${esc(r[3])}</td></tr>`).join('')}
 </tbody></table></div>${sourceBox()}`;
}
function renderSecrets(){
 return `<div class="view-head"><div><h2>놓치기 쉬운 숨은 이벤트</h2><p>메인 플로우를 방해하지 않도록 별도 분리. 특히 9장 → 13장 연계만 체크하면 됩니다.</p></div></div>
 <div class="grid">${DATA.secrets.map((s,i)=>`<article class="card"><div class="meta">${badge('optional')}<span class="badge">${esc(s.time)}</span></div><h3>${esc(s.title)}</h3><p><b>${esc(s.result)}</b><br>${esc(s.text)}</p></article>`).join('')}</div>${sourceBox()}`;
}
function renderSystem(){
 const sections=DATA.systemSections.map((s,i)=>`<details class="guide-section" ${i<2?'open':''}>
   <summary><span>${esc(s.title)}</span><small>${esc(s.page)}</small></summary>
   <div class="guide-body"><p class="guide-lead">${esc(s.lead)}</p><ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>
 </details>`).join('');
 const summonRows=DATA.summons.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('');
 const specialRows=DATA.specialAttacks.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('');
 const jobRows=DATA.jobs.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td>${esc(r[5])}</td><td>${esc(r[6])}</td><td>${esc(r[7])}</td><td>${esc(r[8])}</td></tr>`).join('');
 return `<div class="view-head"><div><h2>시스템 설명</h2><p>PDF p.4~27의 시스템 공략을 실전용으로 재구성했습니다. 필요한 항목만 펼쳐 보세요.</p></div></div>
 <div class="guide-list">${sections}</div>
 <h3 class="section-title">소환정령 빠른표</h3>
 <div class="table-wrap compact-table"><table><thead><tr><th>정령</th><th>사용 직업</th><th>효과</th></tr></thead><tbody>${summonRows}</tbody></table></div>
 <h3 class="section-title">적 특수공격 빠른표</h3>
 <div class="table-wrap compact-table"><table><thead><tr><th>특수공격</th><th>효과</th></tr></thead><tbody>${specialRows}</tbody></table></div>
 <h3 class="section-title">17개 직종 빠른표</h3>
 <div class="table-wrap"><table><thead><tr><th>직종</th><th>HP</th><th>공격</th><th>민첩</th><th>회복</th><th>공격보조</th><th>방어보조</th><th>간접</th><th>역할 요약</th></tr></thead><tbody>${jobRows}</tbody></table></div>
 ${sourceBox()}`;
}
function renderItems(){
 const data=DATA.items368;
 const jobSet=[...new Set(data.flatMap(r=>r.jobs==='모든 직종'?[]:r.jobs.split('·')))].sort((a,b)=>a.localeCompare(b,'ko'));
 const subSet=[...new Set(data.map(r=>r.sub))].sort((a,b)=>a.localeCompare(b,'ko'));
 const levelSet=[...new Set(data.map(r=>r.level))].sort((a,b)=>a-b);
 const rows=data.map(r=>{
   const search=[r.no,r.ko,r.jp,r.status,r.major,r.sub,r.level,r.jobs,r.effect,r.match,r.note].join(' ').toLowerCase();
   const majorClass=r.major==='레어·특수'?'rare':r.major==='특수 변화'?'special':'';
   const statusClass=r.status==='기존 번역 유지'?'keep':'new';
   return `<tr data-item-row data-search="${esc(search)}" data-major="${esc(r.major)}" data-sub="${esc(r.sub)}" data-level="${r.level}" data-jobs="${esc(r.jobs)}" data-status="${esc(r.status)}">
     <td>${r.no}</td>
     <td><b>${esc(r.ko)}</b><div class="jp-name">${esc(r.jp)}</div></td>
     <td><span class="major-tag ${majorClass}">${esc(r.major)}</span></td>
     <td>${esc(r.sub)}</td>
     <td><b>Lv.${r.level}</b></td>
     <td class="effect-cell">${esc(r.effect)}</td>
     <td>${esc(r.jobs)}</td>
     <td><span class="translation-tag ${statusClass}">${esc(r.status)}</span></td>
   </tr>`;
 }).join('');
 return `<div class="view-head"><div><h2>아이템·장비 368 완전표</h2><p>기존 확정 번역을 유지하면서 전체 장비를 번호·분류·레벨·효과·직종까지 한 표로 통합했습니다.</p></div></div>
 <div class="item-kpis">
   <div class="item-kpi"><strong>368</strong><span>전체 아이템·장비</span></div>
 </div>
 <div class="item-top">
   <div class="item-rule"><b>최대 32개</b><span>소지 한도를 넘긴 상태에서 새 장비를 얻으면 기존 아이템 하나를 골라 정리해야 합니다.</span></div>
   <div class="item-rule"><b>일반 장비는 성장</b><span>장비한 채 전투하면 경험치가 쌓여 같은 계열의 다음 레벨 장비로 성장합니다. 표의 Lv.는 계열 내 단계입니다.</span></div>
   <div class="item-rule"><b>퇴단 시 전승</b><span>장비를 자손에게 전승하면 경험치 100%, 다른 동료에게 전승하면 50%가 이어집니다.</span></div>
 </div>
 <div class="warning-box"><strong>레어·특수 / 특수 변화 장비도 통합</strong><div class="mini-note">Lv.10·11 레어/특수 22개와 Lv.12·15 특수 변화 4개를 일반 성장 장비와 함께 검색할 수 있습니다.</div></div>
 <div class="item-filter-grid">
   <input id="search" class="search" type="search" placeholder="한글명·일본어·효과·직업 검색">
   <select id="itemMajor" class="item-select"><option value="">모든 분류</option><option>일반 성장 장비</option><option>레어·특수</option><option>특수 변화</option></select>
   <select id="itemSub" class="item-select"><option value="">모든 종류</option>${subSet.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>
   <select id="itemJob" class="item-select"><option value="">모든 직업</option>${jobSet.map(j=>`<option value="${esc(j)}">${esc(j)}</option>`).join('')}</select>
   <select id="itemLevel" class="item-select"><option value="">모든 레벨</option>${levelSet.map(l=>`<option value="${l}">Lv.${l}</option>`).join('')}</select>
 </div>
 <div class="item-controls">
   <select id="itemStatus" class="item-select"><option value="">번역 상태 전체</option><option>기존 번역 유지</option><option>신규 번역</option></select>
   <span class="item-count" id="itemCount">${data.length}개</span>
 </div>
 <div class="table-wrap item-table"><table><thead><tr><th>No.</th><th>이름</th><th>분류</th><th>종류</th><th>레벨</th><th>효과</th><th>사용 가능 직종</th><th>번역 상태</th></tr></thead><tbody id="itemRows">${rows}</tbody></table></div>`;
}
function bindChecks(){
 document.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',e=>{
  const id=e.target.dataset.check;
  if(e.target.checked)state.checks[id]=1;else delete state.checks[id];
  localStorage.setItem('vb_flow_checks',JSON.stringify(state.checks)); updateStats();
  e.target.closest('.event')?.classList.toggle('done',e.target.checked);
 }));
}
function bindSearch(){
 const qbox=document.getElementById('search'); if(!qbox)return;
 if(state.view==='items'){
   const apply=()=>{
     const q=qbox.value.trim().toLowerCase();
     const major=document.getElementById('itemMajor')?.value||'';
     const sub=document.getElementById('itemSub')?.value||'';
     const job=document.getElementById('itemJob')?.value||'';
     const level=document.getElementById('itemLevel')?.value||'';
     const status=document.getElementById('itemStatus')?.value||'';
     let shown=0;
     document.querySelectorAll('[data-item-row]').forEach(el=>{
       const jobs=(el.dataset.jobs||'').split('·');
       const okQ=!q||el.dataset.search.includes(q);
       const okMajor=!major||el.dataset.major===major;
       const okSub=!sub||el.dataset.sub===sub;
       const okJob=!job||el.dataset.jobs==='모든 직종'||jobs.includes(job);
       const okLevel=!level||el.dataset.level===level;
       const okStatus=!status||el.dataset.status===status;
       const ok=okQ&&okMajor&&okSub&&okJob&&okLevel&&okStatus;
       el.hidden=!ok;if(ok)shown++;
     });
     const c=document.getElementById('itemCount');if(c)c.textContent=shown+'개';
   };
   ['input','change'].forEach(ev=>qbox.addEventListener(ev,apply));
   ['itemMajor','itemSub','itemJob','itemLevel','itemStatus'].forEach(id=>document.getElementById(id)?.addEventListener('change',apply));
   apply();return;
 }
 qbox.addEventListener('input',()=>{
  const q=qbox.value.trim().toLowerCase();
  const rows=document.querySelectorAll('[data-search]');
  let shown=0;
  rows.forEach(el=>{
   let ok=!q||el.dataset.search.includes(q);
   if(state.view==='flow'&&state.filter!=='all'){
      const want=state.filter==='leave'?['leave','leaveopt']: [state.filter];
      ok=ok&&want.some(x=>(el.dataset.types||'').split(' ').includes(x));
   }
   el.hidden=!ok;if(ok)shown++;
  });
  let old=document.getElementById('emptySearch');if(old)old.remove();
  if(!shown){const d=document.createElement('div');d.id='emptySearch';d.className='empty';d.textContent='검색 결과가 없습니다.';(document.getElementById('chapterList')||document.querySelector('.table-wrap')).after(d)}
 });
}
function bindFilters(){
 document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
  state.filter=b.dataset.filter;localStorage.setItem('vb_flow_filter',state.filter);render();
 }));
}
function updateStats(){
 const all=DATA.chapters.reduce((n,c)=>n+c.events.length,0);
 const done=Object.keys(state.checks).filter(k=>state.checks[k]).length;
 const pct=all?Math.round(done/all*100):0;
 document.getElementById('pct').textContent=pct+'%';
 document.getElementById('count').textContent=`${done} / ${all} 체크`;
 document.getElementById('fill').style.width=pct+'%';
}
function syncButtons(){document.querySelectorAll('[data-layout-mode]').forEach(b=>{const active=b.dataset.layoutMode===state.layout;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view))}
function render(){
 const c=document.getElementById('content');
 c.innerHTML=state.view==='flow'?renderFlow():state.view==='roster'?renderRoster():state.view==='bosses'?renderBosses():state.view==='secrets'?renderSecrets():state.view==='items'?renderItems():renderSystem();
 syncButtons();bindChecks();bindSearch();bindFilters();updateStats();
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;localStorage.setItem('vb_flow_view',state.view);render()}));
document.getElementById('themeBtn').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme==='dark'?'dark':'';localStorage.setItem('vb_flow_theme',state.theme);document.getElementById('themeBtn').textContent=state.theme==='dark'?'☀ 밝게':'☾ 어둡게'});
document.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('스토리 체크 기록을 모두 초기화할까요?')){state.checks={};localStorage.removeItem('vb_flow_checks');render()}});
document.getElementById('themeBtn').textContent=state.theme==='dark'?'☀ 밝게':'☾ 어둡게';
document.querySelectorAll('[data-layout-mode]').forEach(b=>b.addEventListener('click',()=>{state.layout=b.dataset.layoutMode;localStorage.setItem('vb_flow_layout',state.layout);document.documentElement.dataset.layout=state.layout;syncButtons()}));
render();
</script>
</body>
</html>
