<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dollars Archive 공략집</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{--bg:#f2f3f6;--surface:#fff;--ink:#18202e;--muted:#5e6676;--line:#dadde5;--accent:#2648d8;--soft:#e4e9fc;--ok:#1e7f4f;--oksoft:#dff2e7}
@media(prefers-color-scheme:dark){:root{--bg:#0f131b;--surface:#171c27;--ink:#e6e9f0;--muted:#98a0b0;--line:#2a3140;--accent:#7c98ff;--soft:#1e2747;--ok:#5ccb91;--oksoft:#173326;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "IBM Plex Sans KR","Malgun Gothic",sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.wrap{max-width:1080px;margin:auto;padding:40px 20px 64px;display:flex;flex-direction:column;gap:26px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}h1{font:800 clamp(28px,5vw,40px)/1.2 "Gothic A1","Malgun Gothic",sans-serif;margin:5px 0 12px}header p{margin:0;color:var(--muted);font-size:14px}nav{display:flex;gap:16px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(2,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px}.stat{padding:18px 22px}.stat:first-child{border-right:1px solid var(--line)}.stat b{display:block;font-size:28px;line-height:1.2}.stat span{font-size:13px;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}label{font-size:12px;color:var(--muted)}select,input{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-left:8px}input{margin-left:0;max-width:100%;width:250px}select{max-width:190px}#selection{font-size:13px;color:var(--muted)}[hidden]{display:none!important}.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}.row{display:grid;grid-template-columns:88px minmax(0,1fr) 100px;gap:20px;padding:22px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.cover{width:88px;height:112px;display:flex;justify-content:center;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--muted);font-size:12px}.cover img{width:100%;height:100%;object-fit:contain}.game{font:800 19px/1.4 "Gothic A1","Malgun Gothic",sans-serif;margin:0 0 4px}.guide-title{font-size:16px;margin:6px 0}.platforms{font-size:12px;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:var(--soft);color:var(--accent);border-radius:5px;padding:3px 8px;font-size:11px}.tag.format{background:var(--oksoft);color:var(--ok)}.links{display:flex;gap:16px;font-size:13px;margin-top:12px}.updated{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}.empty{padding:52px 24px;text-align:center}.empty h2{font-size:18px;margin:0 0 10px}.empty p{margin:0;color:var(--muted);font-size:14px}.note,footer{font-size:12px;color:var(--muted)}.row div{min-width:0;overflow-wrap:anywhere}@media(max-width:620px){.row{grid-template-columns:64px minmax(0,1fr);gap:14px;padding:18px}.cover{width:64px;height:84px}.updated{grid-column:2;text-align:left}.wrap{padding-top:28px}.game{font-size:17px}select{max-width:160px}}
</style></head><body>
<main class="wrap">
<header><div><div class="eyebrow">DOLLARS ARCHIVE</div><h1>직접 만든 공략집</h1><p>게임을 끝까지 즐기기 위한 진행·분기·수집 공략을 모읍니다.</p></div><nav><a href="https://dollars-archive.github.io/Dollars-Archive/">한글패치 모음</a><a href="https://github.com/Dollars-Archive/Game-Walkthrough-Archive">저장소</a></nav></header>
<section class="stats" aria-label="공략집 요약"><div class="stat"><b id="guide-count">—</b><span>공략집</span></div><div class="stat"><b id="game-count">—</b><span>게임</span></div></section>
<section class="controls" aria-label="공략집 검색과 필터"><label>기종<select id="platform" aria-label="기종"><option>전체</option></select></label><label>종류<select id="category" aria-label="공략 종류"><option>전체</option></select></label><input id="search" type="search" placeholder="게임·공략 제목 검색" aria-label="게임 또는 공략 제목 검색"></section>
<div id="selection" hidden>선택한 게임의 공략을 보고 있습니다. <a href="./">전체 공략 보기</a></div>
<section class="list" id="list" aria-live="polite"><div class="empty"><p>공략집 목록을 불러오는 중입니다.</p></div></section>
<div class="note">Dollars Archive가 직접 작성한 공략만 등록합니다. 표지는 한글패치 모음의 자료를 함께 사용합니다.</div>
<footer>공략을 등록하거나 수정하면 목록이 자동으로 갱신됩니다.</footer>
</main><script src="archive.js"></script></body></html>
